<!DOCTYPE html>
<html>
<head>
    <title>Login - Family Project</title>
</head>
<body>
    <h2>Login</h2>
    <form method="post">
        Usuario: <input type="text" name="username"><br>
        Contraseña: <input type="password" name="password"><br>
        <button type="submit">Entrar</button>
    </form>
    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}
</body>
</html>
