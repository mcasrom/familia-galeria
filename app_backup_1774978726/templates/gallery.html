<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Galería - Family Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        h2 { text-align: center; margin: 20px 0; }

        /* Galería */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 0 20px 20px 20px;
        }
        .photo-card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 220px;
            text-align: center;
        }
        .photo-card img {
            width: 100%;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .photo-card img:hover { transform: scale(1.05); }
        .photo-card form, .photo-card input {
            margin: 5px 0;
        }
        input[type="text"] { width: 90%; padding: 3px; }

        /* Modal */
        #modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        #modal-img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 6px;
        }
        #close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Galería de Fotos</h2>

<div class="gallery">
    {% for foto in fotos %}
    <div class="photo-card">
        <img src="{{ url_for('fotos', filename=foto) }}" alt="{{ foto }}" class="carousel-img">
        <form method="post" action="{{ url_for('delete', filename=foto) }}">
            <button type="submit">Eliminar</button>
        </form>
        <input type="text" value="{{ tags.get(foto, '') }}" onchange="updateTag('{{ foto }}', this.value)">
    </div>
    {% endfor %}
</div>

<!-- Modal -->
<div id="modal" onclick="closeModal()">
    <span id="close">&times;</span>
    <img id="modal-img">
</div>

<script>
    // Modal manual
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');

    function openModal(src) {
        modal.style.display = 'flex';
        modalImg.src = src;
    }
    function closeModal() {
        modal.style.display = 'none';
    }
    document.getElementById('close').onclick = closeModal;

    // Carrusel automático
    let carouselIndex = 0;
    const carouselImgs = document.querySelectorAll('.carousel-img');

    function showNextImage() {
        if(carouselImgs.length === 0) return;
        // Abrir modal con la imagen actual
        openModal(carouselImgs[carouselIndex].src);
        carouselIndex = (carouselIndex + 1) % carouselImgs.length;
    }

    // Cambiar imagen cada 5 segundos
    setInterval(showNextImage, 5000);

</script>
</body>
</html>
