<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería Familia · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --sepia:    #c8a97e;
    --dark:     #1a1208;
    --cream:    #f5efe4;
    --brown:    #5c3d1e;
    --accent:   #8b4513;
    --error:    #9b2626;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(139,69,19,.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(200,169,126,.12) 0%, transparent 50%);
  }

  .card {
    width: 380px;
    background: var(--cream);
    padding: 3rem 2.5rem 2.5rem;
    position: relative;
    box-shadow: 0 0 0 1px rgba(200,169,126,.3), 0 20px 60px rgba(0,0,0,.7);
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(139,69,19,.2);
    pointer-events: none;
  }

  .logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .logo-icon {
    font-size: 2.5rem;
    line-height: 1;
    margin-bottom: .5rem;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--brown);
    text-align: center;
    margin-bottom: .3rem;
  }
  .subtitle {
    font-size: .8rem;
    color: var(--sepia);
    text-align: center;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .field { margin-bottom: 1.2rem; }
  label {
    display: block;
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--brown);
    margin-bottom: .4rem;
    font-weight: 400;
  }
  input {
    width: 100%;
    padding: .65rem .9rem;
    border: 1px solid rgba(139,69,19,.3);
    background: rgba(255,255,255,.6);
    font-family: 'Lato', sans-serif;
    font-size: .95rem;
    color: var(--dark);
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); background: #fff; }

  .btn {
    width: 100%;
    padding: .8rem;
    margin-top: .5rem;
    background: var(--brown);
    color: var(--cream);
    border: none;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    letter-spacing: .05em;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .btn:hover  { background: var(--accent); }
  .btn:active { transform: scale(.98); }

  .flash {
    background: rgba(155,38,38,.1);
    border-left: 3px solid var(--error);
    color: var(--error);
    padding: .6rem .9rem;
    font-size: .85rem;
    margin-bottom: 1.2rem;
  }

  .year {
    text-align: center;
    font-size: .72rem;
    color: var(--sepia);
    margin-top: 1.8rem;
    letter-spacing: .08em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">📷</div>
    <h1>Galería Familiar</h1>
    <p class="subtitle">Memorias · Siglo XX</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('login') }}">
    <div class="field">
      <label>Usuario</label>
      <input type="text" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Entrar</button>
  </form>
  <p class="year">Familia · Murcia · España</p>
</div>
</body>
</html>
