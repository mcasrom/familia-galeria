<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Galería Familiar</title>
<style>
body {
  margin: 0;
  background: #0d0d0d;
  color: white;
  font-family: Arial, sans-serif;
}
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 10px 15px;
  background: #111;
  align-items: center;
}
.search-bar {
  text-align: center;
  padding: 10px;
  background: #111;
}
.search-bar input {
  width: 60%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}
.tag {
  display: inline-block;
  background: #444;
  padding: 4px 10px;
  margin: 3px 2px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}
.tag:hover {
  background: #666;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 15px;
  padding: 20px;
}
.card {
  position: relative;
  background: #1a1a1a;
  border-radius: 8px;
  overflow: hidden;
}
.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  cursor: pointer;
  transition: transform 0.2s;
}
.card:hover img {
  transform: scale(1.05);
}
.tag-list {
  padding: 8px 10px;
  min-height: 30px;
}
.acciones {
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  opacity: 0;
  transition: opacity 0.2s;
}
.card:hover .acciones {
  opacity: 1;
}
button {
  background: rgba(0,0,0,0.7);
  border: none;
  color: white;
  padding: 8px 12px;
  margin: 2px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
}
button:hover {
  background: #222;
}
/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
}
.modal img {
  display: block;
  margin: auto;
  margin-top: 5%;
  max-width: 90%;
  max-height: 80%;
}
.close {
  position: absolute;
  top: 15px;
  right: 25px;
  font-size: 40px;
  cursor: pointer;
  color: white;
}
.nav {
  position: absolute;
  top: 50%;
  font-size: 50px;
  cursor: pointer;
  padding: 20px;
  color: white;
}
.left { left: 0; }
.right { right: 0; }
</style>
</head>
<body>

<div class="topbar">
  <div>📸 Álbum Familiar</div>
  <div>
    {% if session.get("role") == "admin" %}
    <a href="/trash" style="color:white; margin-right:15px;">🗑 Papelera</a>
    {% endif %}
    <a href="/logout" style="color:white;">Logout</a>
  </div>
</div>

<!-- BARRA DE BÚSQUEDA -->
<div class="search-bar">
  <input 
    type="text" 
    id="searchInput" 
    placeholder="🔍 Buscar por nombre o tag..." 
    onkeyup="buscar()"
  >
</div>

<div class="gallery" id="gallery">
{% for f in fotos %}
<div class="card" data-tags="{{ tags.get(f, []) | join(',') }}" id="card-{{f}}">
  
  <img src="/fotos/{{f}}" onclick="abrirModal('{{f}}')">
  
  <!-- TAGS DINÁMICOS -->
  <div class="tag-list">
    {% for t in tags.get(f, []) %}
      <span class="tag">{{t}}</span>
    {% endfor %}
  </div>

  <div class="acciones">
    <button onclick="abrirModal('{{f}}')">👁</button>
    {% if session.get("role") == "admin" %}
    <button onclick="borrar('{{f}}')">🗑</button>
    {% endif %}
    <button onclick="addTag('{{f}}')">🏷</button>
  </div>
</div>
{% endfor %}
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <span class="close" onclick="cerrarModal()">×</span>
  <span class="nav left" onclick="prev()">❮</span>
  <img id="imgGrande">
  <span class="nav right" onclick="next()">❯</span>
</div>

<script>
let fotos = {{ fotos | tojson }};
let current = 0;

// ===================
// MODAL Y CARRUSEL
// ===================
function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

function abrirModal(f) {
  current = fotos.indexOf(f);
  document.getElementById("modal").style.display = "block";
  mostrar();
}

function mostrar() {
  document.getElementById("imgGrande").src = "/fotos/" + fotos[current];
}

function next() {
  current = (current + 1) % fotos.length;
  mostrar();
}

function prev() {
  current = (current - 1 + fotos.length) % fotos.length;
  mostrar();
}

// Cerrar modal al hacer clic fuera de la imagen
document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target === this) cerrarModal();
});

// ===================
// BORRAR FOTO
// ===================
function borrar(f) {
  if (!confirm("⚠️ Esta foto irá a la papelera. ¿Continuar?")) return;
  
  fetch("/delete/" + f, { method: "POST" })
    .then(() => {
      document.getElementById("card-" + f).remove();
      fotos = fotos.filter(x => x !== f);
    });
}

// ===================
// AÑADIR TAG (SIN RECARGAR)
// ===================
function addTag(f) {
  let tag = prompt("Nuevo tag:");
  if (!tag || tag.trim() === "") return;
  tag = tag.trim();

  fetch("/update_tag", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "filename=" + encodeURIComponent(f) + "&tag=" + encodeURIComponent(tag)
  })
  .then(r => r.json())
  .then(data => {
    let card = document.getElementById("card-" + f);
    card.dataset.tags = data.tags.join(",");

    let tagContainer = card.querySelector(".tag-list");
    tagContainer.innerHTML = "";

    data.tags.forEach(t => {
      let span = document.createElement("span");
      span.className = "tag";
      span.innerText = t;
      tagContainer.appendChild(span);
    });
  });
}

// ===================
// BÚSQUEDA EN TIEMPO REAL
// ===================
function buscar() {
  let input = document.getElementById("searchInput").value.toLowerCase().trim();

  document.querySelectorAll(".card").forEach(card => {
    let filename = card.id.replace("card-", "").toLowerCase();
    let tags = (card.dataset.tags || "").toLowerCase();

    if (filename.includes(input) || tags.includes(input)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}

// ===================
// FILTRO POR TAGS (clic en tags superiores) - opcional mantener
// ===================
let allTags = new Set();
document.querySelectorAll(".card").forEach(card => {
  let t = card.dataset.tags;
  if (t) {
    t.split(",").forEach(tag => {
      if (tag.trim()) allTags.add(tag.trim());
    });
  }
});

let container = document.getElementById("tagsContainer"); // si decides volver a usarlo
// (por ahora lo dejamos comentado ya que tienes búsqueda general)

</script>
</body>
</html>
