<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Papelera</title>

<style>
body {
  background: #111;
  color: white;
  font-family: Arial;
}

.topbar {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #000;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  position: relative;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.actions {
  display: flex;
  justify-content: space-around;
  margin-top: 5px;
}

button {
  padding: 5px;
  border: none;
  cursor: pointer;
  background: #333;
  color: white;
}
</style>
</head>

<body>

<div class="topbar">
  <div>🗑 Papelera</div>
  <div>
    <a href="/gallery" style="color:white;">Volver</a> |
    <a href="/logout" style="color:white;">Logout</a>
  </div>
</div>

<div class="gallery">

{% for f in fotos %}
<div class="card" id="card-{{f}}">
  <img src="/fotos/{{f}}">
  
  <div class="actions">
    <button onclick="restore('{{f}}')">♻ Restaurar</button>
    <button onclick="deletePermanent('{{f}}')">❌ Borrar</button>
  </div>
</div>
{% endfor %}

</div>

<script>

function restore(f) {
  fetch("/restore/" + f, {method: "POST"})
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        document.getElementById("card-" + f).remove();
      }
    });
}

function deletePermanent(f) {
  if (!confirm("⚠️ Borrado definitivo. ¿Seguro?")) return;

  fetch("/delete_permanent/" + f, {method: "POST"})
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        document.getElementById("card-" + f).remove();
      }
    });
}

</script>

</body>
</html>
